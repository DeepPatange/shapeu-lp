<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You — Shape-U Obesity Clinic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .thank-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background: linear-gradient(180deg, var(--cream) 0%, #fff 100%);
      text-align: center;
    }
    .thank-card {
      max-width: 560px;
      background: #fff;
      border-radius: 24px;
      padding: 56px 40px;
      box-shadow: 0 30px 80px rgba(15, 20, 25, 0.1);
      border: 1px solid var(--line);
    }
    .thank-icon {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fff5f7, #ffe0e6);
      color: var(--red);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      animation: pop .6s cubic-bezier(.2, .9, .3, 1.3);
    }
    @keyframes pop {
      0%   { transform: scale(0); opacity: 0; }
      70%  { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    .thank-card .eyebrow {
      display: inline-block;
      margin-bottom: 12px;
    }
    .thank-card h1 {
      font-family: var(--serif);
      font-size: 38px;
      font-weight: 600;
      letter-spacing: -0.8px;
      line-height: 1.15;
      margin-bottom: 14px;
      color: var(--ink);
    }
    .thank-card h1 em {
      font-style: italic;
      color: var(--red);
      font-weight: 500;
    }
    .thank-card p {
      font-size: 15.5px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .thank-meta {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .thank-meta-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--ink-soft);
      background: var(--cream);
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
    }
    .thank-meta-item svg { color: var(--red); }
    .thank-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--ink);
      color: #fff;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 14.5px;
      transition: background .2s, transform .15s;
    }
    .thank-cta:hover { background: var(--red); transform: translateY(-1px); }
    @media (max-width: 640px) {
      .thank-card { padding: 40px 24px; }
      .thank-card h1 { font-size: 28px; }
      .thank-card p { font-size: 14px; }
    }
  </style>
</head>
<body>
  <section class="thank-page">
    <div class="thank-card">
      <div class="thank-icon">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <span class="eyebrow">Booking Received</span>
      <h1>Thank you. We'll <em>call you</em> shortly.</h1>

      <a href="index.html" class="thank-cta">
        Back to Home
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
    </div>
  </section>
</body>
</html>
